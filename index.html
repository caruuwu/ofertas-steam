<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos en Steam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/svg/favicon.svg">
</head>

<body>
    <header class="py-4 border-bottom">
        <div class="container">
            <div class="row align-items-center g-3 text-center">
                <div class="col-lg-8 offset-lg-2">
                    <div class="d-flex align-items-center justify-content-center gap-3 mb-2">
                        <img src="assets/svg/logo-header.svg" width="88" height="88" class="flex-shrink-0" alt=""
                            aria-hidden="true">

                        <h1 class="display-4 fw-bold mb-0">Ofertas en Steam</h1>
                    </div>
                    <p class="text-body-secondary mb-0">
                        Busca juegos y revisa sus ofertas.
                    </p>
                </div>

                <div class="selector-moneda col-lg-2">
                    <span id="etiquetaMoneda" class="form-label d-block">
                        Moneda
                    </span>

                    <div class="d-flex justify-content-center gap-2" role="group" aria-labelledby="etiquetaMoneda">
                        <button type="button" class="moneda-btn btn btn-outline-info d-flex align-items-center gap-2"
                            data-moneda="CLP" aria-label="Usar pesos chilenos" aria-pressed="true" title="Peso chileno">
                            <img src="https://flagcdn.com/cl.svg" width="28" height="20" alt="" aria-hidden="true">
                            <span>CLP</span>
                        </button>

                        <button type="button" class="moneda-btn btn btn-outline-info d-flex align-items-center gap-2"
                            data-moneda="USD" aria-label="Usar dólares estadounidenses" aria-pressed="false"
                            title="Dólar estadounidense">
                            <img src="https://flagcdn.com/us.svg" width="28" height="20" alt="" aria-hidden="true">
                            <span>USD</span>
                        </button>
                    </div>

                    <select id="moneda" hidden aria-hidden="true" tabindex="-1">
                        <option value="CLP" selected>CLP · Peso chileno</option>
                        <option value="USD">USD · Dólar estadounidense</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <main class="container my-4">
        <section class="controles p-3 p-md-4 rounded-4 border shadow-sm mb-3" aria-label="Buscar y filtrar ofertas">
            <div class="row g-3 align-items-end">
                <form id="busquedaForm" class="col-lg-6">
                    <label for="busquedaJuego" class="form-label fw-semibold">
                        Buscar un juego:
                    </label>
                    <div class="input-group">
                        <input type="search" id="busquedaJuego" class="form-control" placeholder="Ejemplo: Elden Ring"
                            autocomplete="off">
                        <button class="btn btn-info" type="submit">Buscar</button>
                        <button class="btn btn-outline-secondary" type="button" id="limpiarBusqueda">Limpiar</button>
                    </div>
                </form>

                <div class="col-sm-6 col-lg-3">
                    <label for="precioMaximo" class="form-label fw-semibold">
                        Precio máximo (USD):
                    </label>
                    <select id="precioMaximo" class="form-select">
                        <option value="">Cualquier precio</option>
                        <option value="5">Hasta $5</option>
                        <option value="15">Hasta $15</option>
                        <option value="30">Hasta $30</option>
                    </select>
                </div>

                <div class="col-sm-6 col-lg-3">
                    <label for="ordenJuegos" class="form-label fw-semibold">
                        Ordenar por:
                    </label>
                    <select id="ordenJuegos" class="form-select">
                        <option value="original">Por defecto</option>
                        <option value="precio-desc">Precio: mayor a menor</option>
                        <option value="precio-asc">Precio: menor a mayor</option>
                        <option value="descuento-desc">Descuento: mayor a menor</option>
                        <option value="descuento-asc">Descuento: menor a mayor</option>
                    </select>
                </div>
            </div>
        </section>

        <p id="notaMoneda" class="small text-body-secondary">
            CLP muestra los precios regionales de Steam Chile;
            USD muestra los precios de CheapShark.
        </p>

        <p id="estado" class="text-body-secondary" role="status" aria-live="polite"></p>


        <section aria-labelledby="tituloResultados">
            <h2 id="tituloResultados" class="visually-hidden">
                Juegos y ofertas de Steam
            </h2>

            <div class="juegos row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4">
            </div>
        </section>

        <div class="d-flex justify-content-center mt-4 mb-5">
            <button id="cargarMas" class="btn btn-outline-info px-4" type="button">Cargar más</button>
        </div>
    </main>

    <button id="botonCarrito" type="button"
        class="btn btn-info position-fixed bottom-0 end-0 m-3 rounded-pill shadow d-none border border-2 border-white"
        data-bs-toggle="offcanvas" data-bs-target="#panelCarrito" aria-controls="panelCarrito"
        aria-label="Abrir carrito simulado">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 3h3l3 12h11l3-9H6" />
            <circle cx="9" cy="20" r="1" />
            <circle cx="18" cy="20" r="1" />
        </svg>
        <span id="cantidadCarrito" class="badge text-bg-dark ms-1">0</span>
    </button>

    <aside class="offcanvas offcanvas-end" tabindex="-1" id="panelCarrito" aria-labelledby="tituloCarrito">
        <div class="offcanvas-header border-bottom">
            <h2 id="tituloCarrito" class="offcanvas-title fs-5">
                Carrito
            </h2>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar carrito"></button>
        </div>

        <div class="offcanvas-body d-flex flex-column">
            <p class="small text-body-secondary">
                Simulación de precios. No realiza compras en Steam.
            </p>

            <ul id="listaCarrito" class="list-group list-group-flush mb-3"></ul>

            <div class="mt-auto border-top pt-3">
                <p id="totalCarrito" class="fw-bold fs-5 mb-2" role="status" aria-live="polite"></p>
                <p id="avisoCarrito" class="small text-warning"></p>
                <button id="vaciarCarrito" type="button" class="btn btn-outline-danger w-100">
                    Vaciar carrito
                </button>
            </div>
        </div>
    </aside>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/script.js"></script>
</body>

</html>
